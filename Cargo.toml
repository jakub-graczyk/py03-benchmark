[package]
name = "py03-benchmark"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "py03_benchmark"
crate-type = ["cdylib"]

[dependencies]
futures = "0.3.31"
pyo3 = { version = "0.27", features = ["extension-module", "experimental-async"] }
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime", "async-std-runtime"] }
async-std = "1.13"
tokio = { version = "1.48.0", features = ["full"] }
