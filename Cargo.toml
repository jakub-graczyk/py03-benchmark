[package]
name = "py03-benchmark"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "py03_benchmark"
crate-type = ["cdylib"]

[dependencies]
futures = "0.3.31"
pyo3 = { version = "0.25.1", features = ["extension-module", "experimental-async"] }
tokio = { version = "1.48.0", features = ["full"] }
